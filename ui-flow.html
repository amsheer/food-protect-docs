<title>Food Protect Product Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap">
<style>
/* Layout: a deck. One slide per flow; each slide is a strip of phone screens joined by arrows, with the SFBB rule and the app behaviour beside it. */
:root{--bg:#F6F8F9;--panel:#FFFFFF;--fg:#1F1F1F;--muted:#6B6F76;--line:#E5E7EB;--field:#EBEDED;--accent:#000;--accent-fg:#FFF;--ok:#4CAF50;--bad:#EB5757;--warn:#FFB700;--font:'Montserrat',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--panel:#1E1E1E;--fg:#F1F1F1;--muted:#A0A0A0;--line:#333;--field:#2A2A2A;--accent:#FFF;--accent-fg:#000;--ok:#5DD27A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121212;--panel:#1E1E1E;--fg:#F1F1F1;--muted:#A0A0A0;--line:#333;--field:#2A2A2A;--accent:#FFF;--accent-fg:#000;--ok:#5DD27A;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--font);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}
.brandmk{font-weight:700;font-size:16px}.brandmk span{color:var(--muted);font-weight:500}
.seg{display:inline-flex;background:var(--field);border-radius:10px;padding:3px}
.seg button{border:0;background:none;color:var(--fg);font:500 13px var(--font);padding:7px 14px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-fg)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
h1{font-size:34px;line-height:1.15;margin:28px 0 8px;font-weight:700;text-wrap:balance}
h2{font-size:26px;margin:22px 0 4px;font-weight:700;text-wrap:balance}
h3{font-size:14px;margin:0 0 8px;font-weight:600}
p{margin:0 0 10px;max-width:72ch}.muted{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}
.tag{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:500}
.tag b{color:var(--muted);font-weight:500}
.strip{display:flex;flex-wrap:wrap;justify-content:center;gap:18px 6px;margin:6px 0 22px}
.stp{display:flex;align-items:center;gap:6px}
.fig .cap{text-align:center;font-size:12.5px;font-weight:600;margin-bottom:8px}
.fig .cap span{color:var(--muted);font-weight:500;margin-right:4px}
.arr{font-size:26px;color:var(--muted);flex:none}
@media(max-width:1000px){.arr{display:none}}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card ul{margin:0;padding-left:18px}.card li{margin-bottom:4px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--field)}
.pill.ok{background:var(--ok);color:#000}.pill.warn{background:var(--warn);color:#000}.pill.bad{background:var(--bad);color:#fff}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px}
.btn{border:0;background:var(--accent);color:var(--accent-fg);font:600 14px var(--font);padding:10px 20px;border-radius:10px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:var(--line);padding:0;cursor:pointer}
.dots button.on{background:var(--accent)}
.toc{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin-top:18px}
.toc button{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:12px 14px;font:500 14px var(--font);cursor:pointer}
.toc button small{display:block;color:var(--muted);font-weight:400;font-size:12px}
a{color:var(--fg)}

/* ---------- Phone frames: fixed light OS screens, not page-themed ---------- */
.dev{width:272px;height:586px;border-radius:34px;border:7px solid #17171a;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--d-bg);color:var(--d-fg);flex:none}
.dev *{min-width:0}.dev b{font-weight:inherit}
.sbar{display:flex;justify-content:space-between;align-items:center;padding:7px 18px 3px;font-size:11px;font-weight:500}
.k-open{background:#E8E8E8;color:#333}.k-ok{background:#C8E6C9;color:#1B5E20}.k-bad{background:#FFCDD2;color:#B71C1C}.k-warn{background:#FFE9A8;color:#6B4E00}
.d-open{background:#9E9E9E}.d-ok{background:#4CAF50}.d-bad{background:#EB5757}.d-warn{background:#FFB700}
.ban{border-radius:12px;padding:9px 12px;margin:8px 0;font-size:12.5px;line-height:1.4}
.prog{height:4px;background:#DDD;border-radius:2px;margin:4px 0 8px;overflow:hidden}.prog i{display:block;height:100%;background:#000}
.plab{font-size:12px;opacity:.65}
.sigbox{height:62px;border:1.5px dashed #9E9E9E;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#8A8A8E;font-size:12.5px;margin:8px 0}
.hint{font-size:12px;opacity:.65;margin:4px 2px}
.empty{text-align:center;padding:54px 12px 0;opacity:.8}.empty b{display:block;font-size:18px;margin:10px 0 4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px;margin:4px 0 8px}
.cal span{padding:4px 0;border-radius:50%}.cal .h{opacity:.6;font-size:10.5px}
.cal i{display:block;width:5px;height:5px;border-radius:50%;margin:1px auto 0}.cal .sel{background:#000;color:#fff}
.otp{display:flex;gap:5px;margin:12px 0}.otp span{flex:1;height:44px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:19px}
.brand{text-align:center;font:700 25px 'Montserrat',sans-serif;margin:34px 0 18px}
/* Android, Material 3 */
.a{--d-bg:#FEF7FF;--d-fg:#1D1B20;--d-sur:#F3EDF7;--d-line:#CAC4D0;--d-mut:#49454F;font-family:'Roboto',system-ui,sans-serif;font-size:14px}
.a .atop{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 10px;height:52px}
.a .atop h3{margin:0;font-size:21px;font-weight:400;flex:1}
.a .abody{flex:1;overflow:hidden;padding:2px 14px 8px}
.a .ali{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid #E7E0EC}
.a .ali>div{flex:1}.a .ali b{display:block;font-size:15px;font-weight:400}.a .ali small{color:var(--d-mut);font-size:12px}
.a .adot{width:10px;height:10px;border-radius:50%;flex:none}
.a .chip{font-size:11px;font-weight:500;padding:3px 9px;border-radius:8px}

.a .abtn,.a .abtn2{display:block;width:100%;border-radius:100px;font:500 14px 'Roboto',sans-serif;padding:11px}
.a .abtn{border:0;background:#000;color:#fff}.a .abtn2{border:1px solid #79747E;background:none;color:#000;margin-bottom:8px}
.a .afoot{padding:8px 14px 4px}

.a .achips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.a .achips span{border:1px solid var(--d-line);border-radius:8px;padding:5px 10px;font-size:13px}
.a .achips span.on{background:#E8DEF8;border-color:#E8DEF8}
.a .anav{display:flex;background:var(--d-sur);padding:8px 0 4px;height:66px}

.a .anav div.on{color:#000;font-weight:500}.a .anav div.on i{background:#E8DEF8}
.a .fab{position:absolute;right:14px;bottom:82px;width:54px;height:54px;border-radius:16px;background:#E8DEF8;color:#21005D;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.25)}
.a .gest{height:4px;width:100px;border-radius:2px;background:#000;opacity:.5;margin:3px auto 5px}
.a .card2{background:var(--d-sur);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:13px}
.a .acb{width:18px;height:18px;border:2px solid #49454F;border-radius:2px;flex:none;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;line-height:1}.a .acb.on{background:#000;border-color:#000}
.a .otp span{border:1px solid #79747E}
.a .sigbox{border-radius:4px}.a .ban{border-radius:12px}
/* iOS */
.i{--d-bg:#F2F2F7;--d-fg:#000;--d-sur:#fff;--d-line:#C6C6C8;--d-mut:#8A8A8E;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',system-ui,sans-serif;font-size:15px}
.i .sbar{padding:9px 24px 2px;font-weight:600;font-size:13px}.i .isl{width:70px;height:20px;border-radius:12px;background:#000;margin-top:-2px}
.i .inav{display:flex;justify-content:space-between;align-items:center;padding:4px 14px;color:#000;font-size:16px;min-height:30px}

.i .chev{color:#C4C4C7;font-size:19px;flex:none}
.i .badge{font-size:11px;font-weight:600;padding:2px 7px;border-radius:6px;flex:none}
.i .sec{font-size:12px;color:var(--d-mut);text-transform:uppercase;margin:10px 0 0 12px}
.i .ibtn{display:block;width:100%;border:0;border-radius:12px;background:#000;color:#fff;font:600 16px -apple-system,system-ui,sans-serif;padding:13px;margin:0 0 6px}
.i .ibtn2{display:block;width:100%;border:0;border-radius:12px;background:#E3E3E8;color:#000;font:600 16px -apple-system,system-ui,sans-serif;padding:13px;margin:0 0 8px}
.i .ifoot{padding:6px 14px 2px}
.i .iseg{display:flex;background:#E3E3E8;border-radius:9px;padding:2px;margin:6px 0 10px}
.i .iseg span{flex:1;text-align:center;padding:6px 3px;font-size:12px;border-radius:7px}.i .iseg span.on{background:#fff;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.i .itab{display:flex;background:rgba(249,249,249,.94);border-top:.5px solid var(--d-line);padding:6px 0 2px;height:58px}
.i .itab div{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:#8A8A8E}.i .itab div.on{color:#000}
.i .home{height:5px;width:110px;border-radius:3px;background:#000;margin:3px auto 5px}
.i .otp span{background:#fff}
.i .icb{width:22px;height:22px;border:1.5px solid #C4C4C7;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}.i .icb.on{background:#000;border-color:#000}
.i .ban{border-radius:10px}.i .card2{background:#fff;border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:13px}
/* ---------- Web console frames: a desktop browser with sidebar, filters, dense tables ---------- */
.wbr{width:560px;max-width:100%;border:1px solid #D0D4D8;border-radius:10px;overflow:hidden;background:#fff;color:#1F1F1F;font-family:'Montserrat',system-ui,sans-serif;font-size:11px;box-shadow:0 6px 20px rgba(0,0,0,.12);flex:none}
.wbr *{min-width:0}
.wchrome{display:flex;gap:5px;align-items:center;padding:6px 10px;background:#ECECEC;font-size:10px;color:#555}
.wchrome i{width:9px;height:9px;border-radius:50%;background:#C9C9C9}.wchrome span{flex:1;background:#fff;border-radius:5px;padding:2px 10px;margin-left:8px}
.wapp{display:grid;grid-template-columns:128px minmax(0,1fr);height:372px;background:#F6F8F9}
.wside{background:#fff;border-right:1px solid #E5E7EB;padding:10px 6px;overflow:hidden}
.wl{font-weight:700;font-size:12px;padding:2px 8px 10px}
.wi{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;font-weight:500;font-size:10.5px;margin-bottom:1px}.wi svg{flex:none}.wi.on{background:#000;color:#fff}
.wmain{padding:11px 13px;overflow:hidden}
.whd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px}
.wcr{font-size:9.5px;color:#6B6F76}.whd h4{margin:0;font-size:15px}
.wacts{display:flex;gap:5px;flex:none}
.wbtn{background:#000;color:#fff;border-radius:6px;padding:5px 10px;font-weight:600;font-size:10.5px;white-space:nowrap}.wbtn.g{background:#fff;color:#000;border:1px solid #D0D4D8}
.wfil{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}.wfil span{background:#fff;border:1px solid #D9DDE1;border-radius:6px;padding:3px 8px;font-size:10.5px}
.wst{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}.wst div{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:5px 8px;font-size:10px;color:#6B6F76}.wst b{display:block;font-size:17px;color:#1F1F1F}
.wtb{background:#fff;border:1px solid #E5E7EB;border-radius:8px;overflow:hidden;margin-bottom:8px}.wtb table{width:100%;border-collapse:collapse;font-size:10.5px}
.wtb th{background:#FAFAFA;text-align:left;padding:6px 8px;font-weight:600;border-bottom:1px solid #E5E7EB;white-space:nowrap}.wtb td{padding:6px 8px;border-bottom:1px solid #F0F0F0}
.wpn{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:8px 10px;margin-bottom:8px}
.wpn .g2{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}.wpn label{display:block;font-size:9.5px;color:#6B6F76;margin-top:5px}
.wpn .fi{border:1px solid #D9DDE1;border-radius:6px;padding:4px 8px;font-size:11px;background:#fff}
.wpn h5{margin:0 0 2px;font-size:11px}
.wtabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}.wtabs span{padding:4px 10px;border-radius:6px;background:#fff;border:1px solid #D9DDE1;font-size:10.5px}.wtabs span.on{background:#000;color:#fff;border-color:#000}
.wtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.wtiles div{background:#fff;border:1px solid #E5E7EB;border-radius:8px;padding:9px;font-weight:600;font-size:10.5px}.wtiles small{display:block;color:#6B6F76;font-weight:400;font-size:9.5px}
.wbar{display:flex;align-items:flex-end;gap:12px;height:120px;padding:8px 12px 18px;background:#fff;border:1px solid #E5E7EB;border-radius:8px}
.wbar div{flex:1;background:#000;border-radius:3px 3px 0 0;position:relative}.wbar span{position:absolute;bottom:-14px;left:0;font-size:9px;white-space:nowrap;color:#6B6F76}
.web-st{font-size:10px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
.wnote{font-size:10px;color:#6B6F76;margin:2px 0 6px}
.wro{background:#FFE9A8;color:#6B4E00;border-radius:6px;padding:4px 8px;font-size:10px;margin-bottom:8px}
.strip.web{gap:18px 10px}
.pill.ni{background:none;border:1px dashed var(--muted);color:var(--muted);font-weight:500}
.a .anav div i{width:44px}.a .anav div,.i .itab div{min-width:0}
.wbr.tb{width:430px}.wapp.rail{grid-template-columns:44px minmax(0,1fr)}.rail .wside{padding:8px 4px;text-align:center}.rail .wi{padding:6px 0}.panes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rolebar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
.rolebar button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--font);padding:6px 14px;border-radius:999px;cursor:pointer}
.rolebar button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.tier{display:grid;grid-template-columns:150px 1fr 1fr;gap:12px;align-items:center;padding:12px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}

.occ{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}

select.f,input.f{font:500 14px var(--font);padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--fg);max-width:100%}
.chips button{border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--font);padding:6px 12px;border-radius:999px;cursor:pointer;margin:0 6px 6px 0}

<script>

/* ===== Web console helpers ===== */
function wst(t,k){return '<span class="web-st k-'+k+'">'+t+'</span>'}
function wt(cols,rows){return '<div class="wtb"><table><tr>'+cols.map(function(c){return '<th>'+c+'</th>'}).join('')+'</tr>'+rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>'}).join('')+'</tr>'}).join('')+'</table></div>'}
function wf(a){return '<div class="wfil">'+a.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>'}
function wstats(a){return '<div class="wst">'+a.map(function(x){return '<div><b'+(x[2]?' style="color:'+x[2]+'"':'')+'>'+x[0]+'</b>'+x[1]+'</div>'}).join('')+'</div>'}
function wp(a,h){return '<div class="wpn">'+(h?'<h5>'+h+'</h5>':'')+'<div class="g2">'+a.map(function(x){return '<div><label>'+x[0]+'</label><div class="fi">'+x[1]+'</div></div>'}).join('')+'</div></div>'}
function wtabs(a,on){return '<div class="wtabs">'+a.map(function(x,i){return '<span class="'+(i===on?'on':'')+'">'+x+'</span>'}).join('')+'</div>'}
function wbar(a){var m=Math.max.apply(null,a.map(function(x){return x[1]}));return '<div class="wbar">'+a.map(function(x){return '<div style="height:'+Math.round(100*x[1]/m)+'%"><span>'+x[0]+' '+x[1]+'</span></div>'}).join('')+'</div>'}
// wb(role, active nav id, title, crumb, body, button, second button, who label)
function wb(role,active,title,crumb,body,b1,b2,url){var r=rl(role),items=navFor(role);
 return '<div class="wbr"><div class="wchrome"><i></i><i></i><i></i><span>app.foodprotect.example/'+(url||active)+'</span></div><div class="wapp"><div class="wside"><div class="wl">Food Protect</div>'+items.map(function(n){return '<div class="wi '+(n.id===active?'on':'')+'">'+ic(ICN[n.id],13)+SHORT[n.id]+'</div>'}).join('')+'</div><div class="wmain"><div class="whd"><div><div class="wcr">'+crumb+'</div><h4>'+title+'</h4></div><div class="wacts">'+(b2?'<span class="wbtn g">'+b2+'</span>':'')+(b1?'<span class="wbtn">'+b1+'</span>':'')+'</div></div>'+body+'</div></div></div>'}
function ws(c,role,active,title,crumb,bodyFn,b1,b2,url){return {c:c,f:function(){return wb(role,active,title,crumb,bodyFn(),b1,b2,url)}}}

function mobileBar(roleId){var it=navFor(roleId),bar=it.length<=5?it:it.slice(0,4),more=it.length<=5?[]:it.slice(4);return {bar:bar,more:more}}

function occurrences(P){var out=[],d=new Date(P.start+'T00:00:00'),i;
 function lab(x){return x.toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})}
 var per=P.mode==='unlimited'?'any number':P.mode==='onetime'?'1':P.n;
 if(P.freq==='daily'){for(i=0;i<7;i++)out.push([lab(new Date(d.getFullYear(),d.getMonth(),d.getDate()+i)),per+' per day'])}
 else if(P.freq==='weekly'){var s=0;while(out.length<6&&s<60){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()+s);if(P.days.indexOf(x.getDay())>-1)out.push([lab(x),per+' on this day']);s++}}
 else if(P.freq==='monthly'){var dd=parseInt(P.mopt)||1;for(i=0;i<6;i++){var m=/End/.test(P.mopt)?new Date(d.getFullYear(),d.getMonth()+i+1,0):new Date(d.getFullYear(),d.getMonth()+i,dd);out.push([lab(m),per+' this month'])}}
 else if(P.freq==='yearly'){for(i=0;i<4;i++)out.push([lab(new Date(d.getFullYear()+i,d.getMonth(),d.getDate())),per+' this year'])}
 else out.push([lab(d),'once']);
 return out}
